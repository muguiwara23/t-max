name: App Roku (T-Max)

# Solo manual: Arturo la lanza desde la pestaña Actions cuando quiera el .zip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    name: Validar y empaquetar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar BrightScript
        run: npx --yes brighterscript@0.73.8 --rootDir clients/roku --createPackage false --staging-dir /tmp/stage
      - name: Empaquetar
        run: sh scripts/build-roku.sh
      - uses: actions/upload-artifact@v4
        with:
          name: T-Max-Roku
          path: dist/T-Max-Roku.zip
