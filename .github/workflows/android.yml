name: App Android (T-Max)

# Solo manual: Arturo la lanza desde la pestaña Actions. Un solo .apk para teléfono, tablet y Android TV.
on:
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/ios

jobs:
  build-android:
    name: Compilar .apk (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ios/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Preparar proyecto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Compilar (release firmado con la llave de depuración: se instala directo)
        working-directory: clients/ios/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Renombrar
        run: |
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../../dist/T-Max-android.apk
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: T-Max-apk
          path: dist/T-Max-android.apk
